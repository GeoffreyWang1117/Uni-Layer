[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uni-layer"
version = "0.4.0"
description = "A Universal Framework for Layer Contribution Analysis"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Uni-Layer Team", email = "contact@uni-layer.org"}
]
keywords = ["deep learning", "layer analysis", "interpretability", "model compression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "torch>=1.12.0",
    "numpy>=1.21.0",
    "tqdm>=4.62.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "isort>=5.10.0",
]
docs = [
    "sphinx>=4.5.0",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-autodoc-typehints>=1.18.0",
]
viz = [
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "pandas>=1.3.0",
    "networkx>=2.6.0",
    "plotly>=5.0.0",
]
science = [
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
]
integrations = [
    "torch-pruning>=1.2.0",
    "peft>=0.6.0",
    "transformers>=4.20.0",
]
all = [
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "pandas>=1.3.0",
    "transformers>=4.20.0",
    "timm>=0.6.0",
    "networkx>=2.6.0",
    "plotly>=5.0.0",
    "torch-pruning>=1.2.0",
    "peft>=0.6.0",
]

[project.scripts]
uni-layer = "uni_layer.cli:main"

[project.urls]
Homepage = "https://github.com/GeoffreyWang1117/Uni-Layer"
Repository = "https://github.com/GeoffreyWang1117/Uni-Layer"
Issues = "https://github.com/GeoffreyWang1117/Uni-Layer/issues"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=uni_layer --cov-report=term-missing"
